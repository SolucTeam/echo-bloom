name: Sauvegarde du contenu

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Exporte le contenu de la base
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/export-content.mjs
      - name: Commit si changement
        run: |
          git config user.name "content-bot"
          git config user.email "actions@github.com"
          git add content-snapshot
          if git diff --cached --quiet; then
            echo "Contenu inchangé."
          else
            git commit -m "Sauvegarde automatique du contenu du site"
            git push
          fi
